aid: dagangan
name: Dagangan
description: >-
  Dagangan is an Indonesian tech-enabled wholesale e-commerce platform serving small and medium
  retailers (SMEs) in tier 3-4 cities and rural areas. Through a hub-and-spoke network of 50+
  micro-warehouses across remote regions, it connects large suppliers to traditional local retailers,
  giving them affordable mobile access to daily necessities and groceries while reducing delivery costs
  and supply-chain friction. The company operates a consumer/retailer Android shopping application
  (Dagangan Mall), is backed by 500 Global, and is recognized as a Rural Digitalization Partner of
  Indonesia's Ministry of Villages, Disadvantaged Regions, and Transmigration. As of this profile,
  Dagangan publishes no public developer API or OpenAPI specification.
